name: quiz_master2
description: "quiz-master2: Windows personal smart wrong-question notebook (Flutter + SQLite)"
publish_to: "none"
# v2 从 0 重写（2026-11-12）。Flutter 3.47.9 / Dart 3.13.7 锁定。
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  file_picker: ^8.0.0
  # ONNX Runtime 的 Dart 包版本故意不 pin：须在 Win11 上对 Flutter 3.47.9
  # 验证通过后再定（见 docs/decision-log.md D-07）。在此之前 YOLO 服务
  # 以占位模式运行，返回一页一个整题框。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
