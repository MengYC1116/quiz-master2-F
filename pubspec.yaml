name: quiz_master2
description: "quiz-master2: Windows personal smart wrong-question notebook (Flutter + SQLite)"
publish_to: "none"
# v2 从 0 重写（2026-11-12）。Flutter 3.47.9 / Dart 3.13.7 锁定。
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # ARCH-PLAN-B 第 1 阶段：Drift 2.35.4（驱动切换，见
  # docs/ui-replication/ARCH-PLAN-B-DRIFT-DRAFT.md §四）。
  drift: ^2.35.4
  # deleteLegacy 只读版本探针直接用 package:sqlite3，显式声明直接依赖。
  sqlite3: ^3.5.2
  # ARCH-PLAN-B 第 2 阶段：恢复日志原子替换 / 父目录 fsync 的 FFI
  #（ReplaceFileW / CreateFileW / FlushFileBuffers / libc open+fsync，
  # 见 lib/data/journal_ffi.dart；B-NEW-14 / B-NEW-17）。
  ffi: ^2.1.0
  # ARCH-PLAN-A 第 1 阶段：Riverpod 3.x 手写 Provider，不用代码生成
  #（见 docs/ui-replication/ARCH-PLAN-A-STATE-MGMT-DRAFT.md §四）。
  # ^3.4.3 可解析到 3.5.0（最低 Dart 3.12，与 Dart 3.13.7 兼容）。
  flutter_riverpod: ^3.4.3
  path: ^1.9.1
  file_picker: ^8.0.0
  # B11-8：super_clipboard ^0.9.1（Min Dart SDK 3.0，与 Dart 3.13.7 /
  # Flutter 3.47.9 兼容）：Flutter 自带 Clipboard 只支持文本，图片
  # 复制须走插件。super_clipboard 支持 Windows + Linux，写 PNG 时在
  # Windows 上按需转 DIB/DIBv5（原生应用可直接粘贴）；Rust 内核，
  # 未装 Rust 时构建自动下载对应平台的预编译二进制。Win11 真机仍须
  # 实测粘贴（见 docs/ui-replication/B11-8-EXPORT-IMAGE.md）。
  super_clipboard: ^0.9.1
  # onnxruntime 1.4.1（D-23，2026-11-13）：pub.dev 上唯一的 Dart 版
  # ONNX Runtime 插件，最新稳定版；自带各平台原生库（Linux 用
  # libonnxruntime.so.1.15.1，即 ORT 1.15.1）。Dart 3.13.7 /
  # Flutter 3.47.9 下可用，但须在 Win11 上重验（见 D-23）。
  # 除此之外不升级任何依赖。
  onnxruntime: ^1.4.1
  pdfrx_engine: ^0.9.2
  # M1 十三批公式渲染器 POC（2026-11-18）：flutter_math_fork 0.7.4
  #（pub.dev 最新版；sdk >=3.0.0 <4.0.0、flutter >=3.0.0，与
  # Dart 3.13.7 / Flutter 3.47.9 兼容；纯 Dart + KaTeX 子集，离线，
  # Windows 与 Android 通用）。覆盖率实测见
  # test/m1_formula_renderer_test.dart 与
  # ~/workspace/batch13-work/M1-RENDERER-POC.md。
  flutter_math_fork: ^0.7.4
  desktop_drop: ^0.8.4
  crypto: ^3.0.8
  flutter_secure_storage: ^10.3.4
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 十四批 M2：测试直接用 archive 读/改 ZIP（原为传递依赖，现显式声明）。
  archive: ^4.7.1
  # ARCH-PLAN-B 第 1 阶段：Drift 代码生成。
  drift_dev: ^2.35.3
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    # 目录声明只含直属文件，子目录须另列，否则模型打不进包
    # （2026-11-13 实测：只写 assets/models/ 时模型未进包）。
    # 第 2 层模型已移出仓库（见 D-23），只留第 1 层。
    - assets/models/question/
